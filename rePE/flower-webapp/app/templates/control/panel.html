{% extends "base.html" %}
{% block title %}机械臂控制 - FlowER{% endblock %}
{% block content %}
<style>
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center}
.modal.active{display:flex}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;min-width:380px;max-width:500px}
.modal-box h3{margin:0 0 16px 0;color:#58a6ff}
.modal-box input{width:100%;padding:8px;border-radius:4px;border:1px solid #30363d;background:#0d1117;color:white;margin-bottom:12px}
.modal-box select{width:100%;padding:8px;border-radius:4px;border:1px solid #30363d;background:#0d1117;color:white;min-height:150px;margin-bottom:12px;font-family:monospace}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;padding:8px 16px;border-radius:4px;border:0;cursor:pointer;font-size:14px}
.btn-red{background:#d9534f;color:white}
.btn-green{background:#238636;color:white}
.btn-blue{background:#1a3a5c;color:white}
.btn-gray{background:#30363d;color:white}
.btn-yellow{background:#f0ad4e;color:black}
button:disabled{opacity:0.4;cursor:not-allowed}
</style>
<div class="vision-container">
    <h1 class="vision-title">机械臂控制台</h1>

    <!-- Viser link -->
    <div style="margin:20px 0; text-align:center">
        <a id="viser-link" href="#" target="_blank" class="btn btn-green" style="font-size:18px;padding:14px 40px;text-decoration:none">打开 Viser 控制台 →</a>
        <p style="margin-top:8px;color:var(--text-muted);font-size:0.8rem"><span id="url-display"></span></p>
    </div>

   
<div style="display:flex;gap:8px">
            <button onclick="gripperAction(&apos;open&apos;)" class="btn btn-gray">✋ 张开</button>
            <button onclick="gripperAction(&apos;close&apos;)" class="btn btn-gray">✊ 合拢</button>
            <button onclick="gripperAction(&apos;grasp&apos;)" class="btn btn-blue">🤏 抓取</button>
        </div> <hr style="border-color:var(--border-color); margin:25px 0">

    <!-- Random Look -->
    <h2>Random Look <span style="font-size:0.8rem;color:var(--text-muted)">(间隔≥5s)</span></h2>
    <form id="random-form" style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px">
        <div><label style="font-size:0.85rem">次数</label><br><input name="count" value="1" size="4" style="padding:6px;border-radius:4px;border:1px solid var(--border-color);background:#0d1117;color:white"></div>
        <div><label style="font-size:0.85rem">间隔(秒|min-max)</label><br><input name="interval" value="5" size="8" style="padding:6px;border-radius:4px;border:1px solid var(--border-color);background:#0d1117;color:white"></div>
        <div><label style="font-size:0.85rem">回正</label><br><select name="return_home" style="padding:6px;border-radius:4px;border:1px solid var(--border-color);background:#0d1117;color:white"><option value="1">归零</option><option value="0">回起点</option></select></div>
        <div><label style="font-size:0.85rem">交互</label><br><select name="interact" style="padding:6px;border-radius:4px;border:1px solid var(--border-color);background:#0d1117;color:white"><option value="0">关闭</option><option value="1">开启</option></select></div>
        <button type="button" onclick="run(&apos;run&apos;)" class="btn btn-green">执行</button>
        <button type="button" onclick="run(&apos;single&apos;)" class="btn btn-gray">单次</button>
        <button type="button" onclick="run(&apos;home&apos;)" class="btn btn-gray">回正</button>
    </form>
    <div id="result" style="font-size:0.85rem;color:#8b949e"></div>

    <hr style="border-color:var(--border-color); margin:25px 0">

    <!-- Record & Replay -->
    <h2>录制 & 回放</h2>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <button onclick="openRecordModal()" class="btn btn-red">● 新建录制</button>
        <button onclick="loadRecords()" class="btn btn-gray">刷新列表</button>
        <span style="font-size:0.85rem;color:var(--text-muted)">选中后点执行</span>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start">
        <select id="record-list" size="8" style="flex:1;padding:6px;border-radius:4px;border:1px solid var(--border-color);background:#0d1117;color:white;min-width:250px;font-family:monospace"></select>
        <button onclick="execRecord()" class="btn btn-blue">▶ 执行</button>
    </div>
</div>

<!-- Record Modal - Page 1: Name -->
<div class="modal" id="modal-page1">
    <div class="modal-box">
        <h3>新建录制</h3>
        <input id="rec-name" placeholder="输入名称..." value="">
        <div class="btn-group">
            <button onclick="startRecPage2()" class="btn btn-green">继续</button>
            <button onclick="closeModal()" class="btn btn-gray">退出</button>
        </div>
    </div>
</div>

<!-- Record Modal - Page 2: Capture -->
<div class="modal" id="modal-page2">
    <div class="modal-box">
        <h3>录制中: <span id="rec-label"></span></h3>
        <div style="font-size:0.85rem;color:#f0ad4e;margin-bottom:8px" id="rec-pts">0 points</div>
        <select id="cap-list" size="10" style="width:100%;padding:6px;border-radius:4px;border:1px solid #30363d;background:#0d1117;color:white;font-family:monospace;margin-bottom:12px;min-height:200px"></select>
        <div class="btn-group">
            <button onclick="capturePoint()" class="btn btn-blue">📷 截取</button>
            <button onclick="deletePoint()" class="btn btn-red">🗑 删除</button>
            <button onclick="saveRecord()" class="btn btn-green">💾 保存</button>
            <button onclick="cancelRecord()" class="btn btn-gray">退出</button>
        </div>
    </div>
</div>

<script>
(function() {
    var host = window.location.hostname;
    document.getElementById("viser-link").href = "http://" + host + ":8095";
    document.getElementById("url-display").textContent = "http://" + host + ":8095";
    loadRecords();
})();

var capPoints = [];
var capName = "";

function openRecordModal() {
    document.getElementById("modal-page1").classList.add("active");
    document.getElementById("rec-name").value = "";
    document.getElementById("rec-name").focus();
}

function closeModal() {
    document.querySelectorAll(".modal").forEach(function(m) { m.classList.remove("active"); });
    capPoints = [];
}

async function startRecPage2() {
    var name = document.getElementById("rec-name").value.trim();
    if (!name) return alert("请输入名称");
    // Validate on server
    var r = await fetch("/k2bin1s/records/start", {method:"POST", body:new URLSearchParams({name})});
    var j = await r.json();
    if (!j.ok) return alert(j.error);
    capName = name;
    capPoints = [];
    document.getElementById("rec-label").textContent = name;
    document.getElementById("rec-pts").textContent = "0 points";
    document.getElementById("cap-list").innerHTML = "";
    document.getElementById("modal-page1").classList.remove("active");
    document.getElementById("modal-page2").classList.add("active");
}

async function capturePoint() {
    var r = await fetch("/k2bin1s/records/capture");
    var j = await r.json();
    if (!j.ok) return alert(j.error);
    capPoints.push(j.joints);
    document.getElementById("rec-pts").textContent = capPoints.length + " points";
    var sel = document.getElementById("cap-list");
    var opt = document.createElement("option");
    opt.textContent = capPoints.length + ": " + j.joints.map(function(x){return x.toFixed(2)}).join(", ");
    sel.appendChild(opt);
    sel.selectedIndex = sel.options.length - 1;
}

function deletePoint() {
    var sel = document.getElementById("cap-list");
    if (sel.selectedIndex < 0) return;
    capPoints.splice(sel.selectedIndex, 1);
    sel.remove(sel.selectedIndex);
    document.getElementById("rec-pts").textContent = capPoints.length + " points";
    // Re-number
    for (var i = 0; i < sel.options.length; i++) {
        sel.options[i].textContent = (i+1) + ": " + capPoints[i].map(function(x){return x.toFixed(2)}).join(", ");
    }
}

async function saveRecord() {
    if (capPoints.length == 0) return alert("至少需要1个点");
    var r = await fetch("/k2bin1s/records/save", {
        method:"POST",
        body:new URLSearchParams({name: capName, joints: JSON.stringify(capPoints)})
    });
    var j = await r.json();
    if (!j.ok) return alert(j.error);
    closeModal();
    loadRecords();
    document.getElementById("result").textContent = "Saved: " + capName + " (" + capPoints.length + " pts)";
}

function cancelRecord() { closeModal(); }

// ── Random ──
async function run(mode) {
    var f = document.getElementById("random-form");
    var data = new FormData(f);
    if (mode === "single") { data.set("count", ""); data.set("interval", ""); }
    if (mode === "home") { data.set("count", "0"); }
    var r = await fetch("/k2bin1s/random", {method:"POST", body:data});
    var j = await r.json();
    document.getElementById("result").textContent = j.ok ? (j.stdout || "OK") : j.error;
}

// ── Records ──
async function loadRecords() {
    var r = await fetch("/k2bin1s/records");
    var records = await r.json();
    var sel = document.getElementById("record-list");
    sel.innerHTML = "";
    records.forEach(function(rec) {
        var opt = document.createElement("option");
        opt.value = rec.name;
        opt.textContent = rec.name + " (" + rec.count + " pts)";
        sel.appendChild(opt);
    });
}

async function execRecord() {
    var name = document.getElementById("record-list").value;
    if (!name) return;
    var r = await fetch("/k2bin1s/records/replay", {method:"POST", body:new URLSearchParams({name})});
    var j = await r.json();
    document.getElementById("result").textContent = j.ok ? "Replaying " + name : j.error;
}

async function gripperAction(action) {
    var r = await fetch("/k2bin1s/gripper", {method:"POST", body:new URLSearchParams({action})});
    var j = await r.json();
    document.getElementById("result").textContent = j.ok ? j.result : j.error;
}
</script>
{% endblock %}
