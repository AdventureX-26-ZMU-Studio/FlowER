{% extends "base.html" %}

{% block title %}FlowER视界 - FlowER{% endblock %}

{% block content %}
<div class="vision-container">
    <h1 class="vision-title">FlowER视界</h1>
    <p class="home-desc">实时观察花朵的世界</p>

    <div class="video-wrapper" style="position:relative; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;">
        <canvas id="stream-canvas" width="640" height="360"
                style="width:100%; height:100%; display:none;"></canvas>
        <div id="loading" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#8B9A46; font-size:18px; text-align:center;">
            <div style="font-size:48px; margin-bottom:12px;">📷</div>
            <div>正在连接相机...</div>
        </div>
    </div>

    <div class="stream-status" style="margin-top:12px;">
        <span class="status-dot" id="status-dot" style="background: #FFA726;"></span>
        <span id="status-text">连接中</span>
    </div>

    <div class="vision-info mt-4">
        <p class="text-center" style="color: var(--text-muted); font-size: 0.85rem;">
            📡 DaBaiDCW 直连 · WebSocket · <span id="fps-display">0</span> fps
        </p>
    </div>
</div>

<script>
(function() {
    var canvas = document.getElementById('stream-canvas');
    var ctx = canvas.getContext('2d');
    var loading = document.getElementById('loading');
    var statusDot = document.getElementById('status-dot');
    var statusText = document.getElementById('status-text');
    var fpsDisplay = document.getElementById('fps-display');
    var delay = 1000;
    var frameCount = 0;
    var lastFpsTime = Date.now();

    function setLive() {
        loading.style.display = 'none';
        canvas.style.display = 'block';
        statusDot.style.background = '#8B9A46';
        statusText.textContent = '直播中';
    }

    function setError(msg) {
        statusDot.style.background = '#EF5350';
        statusText.textContent = msg || '连接断开';
    }

    function connect() {
        var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var ws = new WebSocket(protocol + '//' + location.host + '/ws/dcw');
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
            delay = 1000;
            setLive();
        };

        ws.onmessage = function(evt) {
            var arrayBuffer = evt.data;
            var blob = new Blob([arrayBuffer], {type: 'image/jpeg'});
            var url = URL.createObjectURL(blob);
            var img = new Image();
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                setLive();
            };
            img.onerror = function() {
                URL.revokeObjectURL(url);
            };
            img.src = url;

            frameCount++;
            var now = Date.now();
            if (now - lastFpsTime >= 1000) {
                fpsDisplay.textContent = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }
        };

        ws.onerror = function() {
            setError('连接错误');
        };

        ws.onclose = function() {
            setError('断开, ' + Math.round(delay/1000) + '秒后重连...');
            setTimeout(function() {
                delay = Math.min(delay * 2, 30000);
                connect();
            }, delay);
        };
    }

    connect();
})();
</script>
{% endblock %}
