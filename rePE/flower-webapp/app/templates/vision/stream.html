{% extends "base.html" %}

{% block title %}FlowER视界 - FlowER{% endblock %}

{% block content %}
<div class="vision-container">
    <h1 class="vision-title">FlowER视界</h1>
    <p class="home-desc">实时观察花朵的世界</p>

    <div class="video-wrapper" id="video-container">
        <img id="stream-img" src="" alt="花朵实时画面"
             style="width: 100%; height: 100%; object-fit: cover;">

        <div id="placeholder" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #888;">
            <span style="font-size: 3rem;">📷</span>
            <p>等待摄像头连接...</p>
            <div class="loading-spinner"></div>
        </div>

        <div class="stream-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">连接中</span>
        </div>
    </div>

    <div class="vision-info mt-4">
        <p class="text-center" style="color: var(--text-muted); font-size: 0.85rem;">
            📡 奥比中光 DaBaiDCW 实时画面 · 直连摄像头模式 · <span id="fps-counter">--</span> FPS
        </p>
    </div>
</div>

<script>
(function () {
    const streamImg = document.getElementById('stream-img');
    const placeholder = document.getElementById('placeholder');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const fpsCounter = document.getElementById('fps-counter');
    const frameIntervalMs = 66;
    let failures = 0;
    let frameCount = 0;
    let fpsStartedAt = Date.now();
    let displayedObjectUrl = null;

    function setStatus(state, text) {
        const colors = {
            connecting: '#FFA726',
            live: '#8B9A46',
            disconnected: '#EF5350',
        };
        statusDot.style.background = colors[state];
        statusText.textContent = text;
    }

    async function refreshFrame() {
        try {
            // 串行请求：本帧获取完成后才请求下一帧，不会积压。
            const response = await fetch(
                '/FlowER视界/api/snapshot?_=' + Date.now(),
                { cache: 'no-store' },
            );
            if (!response.ok) throw new Error('HTTP ' + response.status);

            const blob = await response.blob();
            const nextObjectUrl = URL.createObjectURL(blob);
            const previousObjectUrl = displayedObjectUrl;
            displayedObjectUrl = nextObjectUrl;
            streamImg.src = nextObjectUrl;
            if (previousObjectUrl) URL.revokeObjectURL(previousObjectUrl);

            placeholder.style.display = 'none';
            setStatus('live', '直播中');
            failures = 0;
            frameCount++;

            const now = Date.now();
            if (now - fpsStartedAt >= 1000) {
                fpsCounter.textContent = Math.round(frameCount * 1000 / (now - fpsStartedAt));
                frameCount = 0;
                fpsStartedAt = now;
            }
            window.setTimeout(refreshFrame, frameIntervalMs);
        } catch (error) {
            failures++;
            const delay = Math.min(500 * failures, 2000);
            setStatus(
                failures >= 3 ? 'disconnected' : 'connecting',
                failures >= 3 ? '摄像头未就绪，重试中...' : '等待摄像头...'
            );
            window.setTimeout(refreshFrame, delay);
        }
    }

    setStatus('connecting', '连接中...');
    window.setTimeout(refreshFrame, 100);
})();
</script>
{% endblock %}
